name: Universal Bot 24/7 Server

on:
  workflow_dispatch:
  schedule:
    - cron: '30 */5 * * *'

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Kodni yuklab olish
        uses: actions/checkout@v4

      - name: Python 3.11 o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: FFmpeg va kutubxonalarni o'rnatish
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install -U pyTelegramBotAPI yt-dlp requests urllib3 pillow

      - name: Botni 5.5 soat davomida uzluksiz ishlatish
        run: |
          timeout 19500s python universal_save_bot.py || true

      - name: Bazani va Reklama Outroni avtomatik saqlab qo'yish
        run: |
          git config --global user.name "UniversalBot-AutoSave"
          git config --global user.email "bot@users.noreply.github.com"
          git add save_bot_database.db promo_assets/ || true
          git diff --staged --quiet || (git commit -m "Auto-save DB and promo assets" && git push)
